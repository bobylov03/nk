<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NC meals — моя кухня</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nc.css">
</head>
<body>
<div class="phone">
  <div id="login" class="col" style="gap:16px;padding:60px 24px">
    <h1 class="serif" style="font-size:30px">Ваша кухня</h1>
    <span class="muted" style="font-size:13.5px;line-height:1.6">Введите телефон, указанный при оформлении рациона. В демо-данных есть <b>+995 555 12 34 56</b>.</span>
    <label><span class="mono">Телефон</span><input id="phone" placeholder="+995 555 12 34 56" inputmode="tel"></label>
    <button class="btn wide" id="enter">Войти</button>
    <a href="/" style="font-size:13px">На главную</a>
  </div>

  <div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <header>
      <div class="row" style="justify-content:space-between">
        <div class="col" style="gap:2px">
          <span class="serif" id="hello" style="font-size:26px"></span>
          <span class="mono" id="sub"></span>
        </div>
        <button class="btn ghost sm" id="exit" style="border-radius:100px">Выйти</button>
      </div>
    </header>
    <main id="body"></main>
    <div class="tabbar" id="tabs"></div>
  </div>
</div>

<script src="/js/nc.js"></script>
<script src="/js/dish-sheet.js"></script>
<script>
const state = { tab: 'today', d: null, swap: null, draft: null, dirty: false };
const $ = (id) => document.getElementById(id);
const RU = { breakfast: 'Завтрак', lunch: 'Обед', dinner: 'Ужин', snack: 'Перекус' };
const MARKS = [['love', '❤️', 'В любимые'], ['repeat', '🔄', 'Можно повторить'], ['never', '🙅', 'Больше не готовить']];

async function load() {
  const id = NC.clientId();
  if (!id) return;
  try {
    state.d = await NC.api('/api/client/' + id);
    state.draft = JSON.parse(JSON.stringify(state.d.profile));
    window.__dishes = (await NC.api('/api/dishes')).dishes.map(d => Object.assign({}, d, { catLabel: RU[d.cat] }));
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    render();
  } catch (e) { localStorage.removeItem('nc_client'); localStorage.removeItem('nc_token'); }
}

$('enter').onclick = async () => {
  try {
    const r = await NC.api('/api/client/login', { method: 'POST', body: { phone: $('phone').value } });
    NC.setToken(r.token); NC.setClient(r.clientId);
    load();
  } catch (e) { NC.toast(e.message); }
};
$('exit').onclick = () => { localStorage.removeItem('nc_client'); localStorage.removeItem('nc_token'); location.reload(); };

async function reload() {
  state.d = await NC.api('/api/client/' + state.d.client.id);
  if (!state.dirty) state.draft = JSON.parse(JSON.stringify(state.d.profile));
  render();
}

function render() {
  const c = state.d.client;
  $('hello').textContent = c.kitchen;
  $('sub').textContent = 'NC · ' + c.planDays + ' дней · ' + NC.dateRu(state.d.today.date, { weekday: 'long', day: 'numeric', month: 'short' });
  $('tabs').innerHTML = [['today', '◉', 'Сегодня'], ['tomorrow', '◐', 'Завтра'], ['collection', '❤', 'Коллекция'],
    ['stats', '▤', 'Статистика'], ['profile', '◇', 'Профиль']]
    .map(([id, ic, label]) => `<button class="${state.tab === id ? 'on' : ''}" data-tab="${id}"><span style="font-size:16px">${ic}</span>${label}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  $('body').innerHTML = ({ today: viewToday, tomorrow: viewTomorrow, collection: viewCollection, stats: viewStats, profile: viewProfile })[state.tab]();
  wire();
  if (window.__dishes) bindSheet($('body'), window.__dishes);
}

/* ---------- общие куски ---------- */
function slotLabel(id) {
  return (state.d.slots.find(s => s.id === id) || {}).label || '08:00–09:00';
}

function chefCard() {
  const n = state.d.chefNote;
  if (!n) return '';
  return `<div class="chef fade"><span class="mono" style="color:rgba(220,192,166,.6)">Сообщение от шефа</span>
    <span class="t">${NC.esc(n.text)}</span></div>`;
}

/* Итог цикла — показывается, когда дни закончились */
function cycleCard() {
  const cy = state.d.cycle;
  if (!cy.done) return '';
  const text = String(state.d.cycleText || '')
    .replace(/\{days\}/g, cy.planDays)
    .replace(/\{dishes\}/g, cy.dishes)
    .replace(/\{rated\}/g, cy.rated);
  return `<div class="cycle fade">
    <span class="mono">Итог цикла</span>
    <span class="serif t">${NC.esc(state.d.cycleTitle)}</span>
    <span class="tx">${NC.esc(text)}</span>
    <div class="cycle-nums">
      <span><b>${cy.days}</b><s>дней доставки</s></span>
      <span><b>${cy.dishes}</b><s>${NC.plural(cy.dishes, 'блюдо', 'блюда', 'блюд')}</s></span>
      ${cy.rated ? `<span><b>${cy.rated}</b><s>${NC.plural(cy.rated, 'оценка', 'оценки', 'оценок')}</s></span>` : ''}
    </div>
    <span class="tx" style="font-size:14px">Готовы продолжить?</span>
    <a class="btn light" href="/order.html" style="border:0;align-self:flex-start">${NC.esc(state.d.cycleCta)}</a>
  </div>`;
}

function planCard() {
  const c = state.d.client;
  const pct = Math.round(c.daysLeft / Math.max(1, c.planDays) * 100);
  return `<div class="card col" style="gap:16px">
    <div class="row" style="justify-content:space-between">
      <span class="mono">Рацион · осталось</span><span style="font-size:11px;letter-spacing:.1em">NC · ${c.planDays} дней</span>
    </div>
    <div class="row plan-body" style="gap:18px">
      <div class="ring" style="background:conic-gradient(var(--plum) ${pct}%, rgba(74,36,61,.12) 0)">
        <div class="ring-in">
          <span class="serif">${c.daysLeft}</span><span class="mono">ДНЕЙ</span>
        </div>
      </div>
      <div class="col" style="gap:8px;flex:1;min-width:0">
        <div class="pc-row"><span>Следующая доставка</span><span class="pc-val">${c.paused ? 'перенесена' : 'завтра, ' + slotLabel(c.slot)}</span></div>
        <div class="pc-row"><span>Статус</span><span class="pc-val">${c.paused ? 'на паузе' : 'активен'}</span></div>
        <div class="row" style="gap:8px">
          <button class="btn ghost sm" id="pause" style="flex:1">${c.paused ? 'Возобновить' : 'Пауза'}</button>
          <button class="btn sm" data-tab-jump="stats" style="flex:1">Продлить</button>
        </div>
      </div>
    </div>
  </div>`;
}

function mealRow(s, date, canSwap) {
  return `<div class="meal" data-dish="${s.dish ? s.dish.id : ''}" style="cursor:pointer">
    ${NC.tile(s.dish)}
    <div class="col" style="gap:5px;flex:1;min-width:0">
      <span class="mono" style="font-size:9px">${s.catLabel}</span>
      <span class="serif" style="font-size:19px;line-height:1.15">${NC.esc(s.dish ? s.dish.name : 'уточняется')}</span>
      <span class="muted" style="font-size:11px">${s.dish ? NC.macros(s.dish) + ' · ' + s.dish.weight + ' г' : ''}</span>
    </div>
    ${canSwap ? `<button class="btn ghost sm" data-swap="${s.cat}" data-date="${date}" style="padding:8px 12px;font-size:10px">Замена</button>` : ''}
  </div>`;
}

function requestNotice() {
  const pending = state.d.requests.filter(r => r.status === 'pending');
  if (!pending.length) return '';
  return `<div class="card row" style="gap:10px;border-color:var(--gold)">
    <span style="width:6px;height:6px;border-radius:50%;background:var(--plum)"></span>
    <span style="font-size:12.5px;line-height:1.5">${pending.map(r => NC.esc(r.text)).join('; ')} — ждём подтверждения до 18:00.</span>
  </div>`;
}

/* блок оценки одного блюда */
function rateBlock(dish, date) {
  const r = (state.d.ratings || []).find(x => x.dishId === dish.id && x.date === date) || { stars: 0, mark: null, text: '' };
  return `<div class="card col" style="gap:12px">
    <div class="row" style="gap:12px">
      ${NC.tile(dish, 'sm')}
      <div class="col" style="gap:3px;flex:1;min-width:0">
        <span class="mono" style="font-size:9px">${dish.catLabel || RU[dish.cat] || ''}</span>
        <span class="serif" style="font-size:17px;line-height:1.15">${NC.esc(dish.name)}</span>
      </div>
    </div>
    <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span class="q-note">Как вам блюдо?</span>
      ${NC.stars(r.stars, dish.id, date)}
    </div>
    <div class="marks">${MARKS.map(([id, ic, label]) =>
      `<button type="button" class="mark ${r.mark === id ? 'on ' + id : ''}" data-mark="${id}" data-dish-id="${dish.id}" data-date="${date}"><span>${ic}</span>${label}</button>`).join('')}</div>
    <details ${r.text ? 'open' : ''}>
      <summary class="mono" style="cursor:pointer">Оставить отзыв</summary>
      <div class="col" style="gap:8px;margin-top:10px">
        <textarea data-review="${dish.id}" data-date="${date}" placeholder="Пара слов о блюде — мы можем опубликовать отзыв на сайте">${NC.esc(r.text)}</textarea>
        <button class="btn ghost sm" data-save-review="${dish.id}" data-date="${date}" style="align-self:flex-start">Сохранить отзыв</button>
      </div>
    </details>
  </div>`;
}

/* ---------- вкладка «Сегодня» ---------- */
function viewToday() {
  const t = state.d.today, n = state.d.norms, y = state.d.yesterday;
  const bars = [['Белки', t.totals.p, n.p, 'г'], ['Жиры', t.totals.f, n.f, 'г'], ['Углеводы', t.totals.c, n.c, 'г'], ['Калории', t.totals.kcal, n.kcal, 'ккал']];
  const yDishes = y.slots.filter(s => s.dish).map(s => Object.assign({}, s.dish, { catLabel: s.catLabel }));
  return `<div class="col fade" style="gap:16px">
    ${cycleCard()}
    ${chefCard()}
    ${planCard()}
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <span class="serif" style="font-size:22px">Меню на сегодня</span><span class="mono" style="font-size:9px">today’s menu</span>
    </div>
    ${requestNotice()}
    ${t.slots.map(s => mealRow(s, t.date, false)).join('')}
    <div class="card col dark" style="gap:14px;background:var(--plum);border:0">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <span class="serif" style="font-size:19px;color:var(--champagne)">КБЖУ дня</span>
        <span class="mono" style="color:rgba(220,192,166,.6)">${t.totals.kcal} ккал из ${n.kcal}</span>
      </div>
      ${bars.map(([label, v, max, unit]) => `
        <div class="col" style="gap:5px">
          <div class="row" style="justify-content:space-between;font-size:11px;color:rgba(220,192,166,.85)"><span>${label}</span><span>${v} ${unit}</span></div>
          <div class="bar"><i style="width:${Math.min(100, Math.round(v / Math.max(1, max) * 100))}%"></i></div>
        </div>`).join('')}
    </div>
    ${yDishes.length ? `
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:6px">
        <span class="serif" style="font-size:22px">Как вам вчера?</span>
        <span class="mono" style="font-size:9px">${NC.dateRu(y.date)}</span>
      </div>
      <span class="q-note">Оценки помогают собирать следующий рацион точнее.</span>
      ${yDishes.map(d => rateBlock(d, y.date)).join('')}` : ''}
  </div>`;
}

/* ---------- вкладка «Завтра» ---------- */
function viewTomorrow() {
  const t = state.d.tomorrow;
  return `<div class="col fade" style="gap:16px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <span class="serif" style="font-size:22px">Что будет завтра</span><span class="mono" style="font-size:9px">${NC.dateRu(t.date)}</span>
    </div>
    ${requestNotice()}
    ${t.slots.map(s => mealRow(s, t.date, true)).join('')}
    <div class="card" style="border-color:var(--gold);font-size:12px;line-height:1.5">Запросы на замену принимаются до 18:00 — каждую замену подтверждаем вручную.</div>
    ${state.swap ? swapSheet() : ''}
  </div>`;
}

function swapSheet() {
  const cat = state.swap.cat;
  const all = window.__dishes || [];
  return `<div class="card col" style="gap:12px;border-color:var(--plum)">
    <span class="serif" style="font-size:20px">Замена · ${RU[cat]}</span>
    <div class="col" style="gap:8px">${all.filter(d => d.cat === cat).map(d => `
      <div class="row" data-pick="${d.id}" style="gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer">
        ${NC.tile(d, 'sm')}
        <span class="col" style="flex:1;gap:2px"><span class="serif" style="font-size:17px">${NC.esc(d.name)}</span><span class="muted" style="font-size:11px">${NC.macros(d)}</span></span>
        <span class="mono" style="font-size:10px">Запросить</span>
      </div>`).join('') || '<span class="muted" style="font-size:13px">Нет альтернатив в этой категории</span>'}</div>
    <button class="btn ghost" id="swap-cancel">Отмена</button>
  </div>`;
}

/* ---------- вкладка «Коллекция» ---------- */
function viewCollection() {
  const items = state.d.collection || [];
  const rated = (state.d.ratings || []).filter(r => r.stars).length;
  return `<div class="col fade" style="gap:16px">
    <div class="col" style="gap:6px">
      <span class="serif" style="font-size:22px">❤️ Моя коллекция</span>
      <span class="q-note">Блюда, которым вы поставили пять звёзд или отметили как любимые.</span>
    </div>
    ${items.length ? `<div class="coll">${items.map(r => `
      <div class="it" data-dish="${r.dish.id}">
        <div class="ph" style="${r.dish.img ? `background-image:url('/img/${r.dish.img}')` : ''}"></div>
        <div class="col" style="gap:4px">
          <span class="serif" style="font-size:16px;line-height:1.15">${NC.esc(r.dish.name)}</span>
          <div class="stars sm">${[1, 2, 3, 4, 5].map(n => `<span style="color:${n <= r.stars ? 'var(--gold-solid)' : 'rgba(74,36,61,.18)'}">★</span>`).join('')}</div>
        </div>
      </div>`).join('')}</div>`
    : '<div class="card" style="font-size:13px;line-height:1.6">Пока пусто. Оценивайте блюда на вкладке «Сегодня» — те, что получат пять звёзд, окажутся здесь.</div>'}
    <div class="hr"></div>
    <span class="mono">Всего оценок: ${rated}</span>
  </div>`;
}

/* ---------- вкладка «Статистика» ---------- */
function viewStats() {
  const s = state.d.stats, c = state.d.client;
  return `<div class="col fade" style="gap:16px">
    <div class="col" style="gap:6px">
      <span class="serif" style="font-size:22px">За этот месяц вы попробовали</span>
      <span class="q-note">${s.monthLabel}</span>
    </div>
    <div class="stat-grid">${s.items.map(i => `
      <div class="stat"><i>${i.icon}</i><b>${i.n}</b><span>${i.label}</span></div>`).join('')}</div>
    ${s.cuisines.length ? `<div class="card col" style="gap:8px"><span class="mono">Кухни в вашем рационе</span>
      <div>${s.cuisines.map(x => `<span class="tag">${NC.esc(x)}</span>`).join('')}</div></div>` : ''}

    <span class="serif" style="font-size:22px">Календарь доставок</span>
    <div class="cal">${state.d.calendar.map(d => `
      <div class="${[d.active ? 'active' : '', d.paused ? 'paused' : '', d.date === state.d.today.date ? 'today' : ''].join(' ')}">
        <span>${d.day}</span><i></i>
      </div>`).join('')}</div>
    <div class="cal-legend">
      <span><i class="m-active"></i>доставка</span>
      <span><i class="m-paused"></i>пауза</span>
      <span><i class="m-off"></i>вне рациона</span>
    </div>

    <span class="serif" style="font-size:22px">История заказов</span>
    ${(state.d.history || []).map(h => `<div class="card row" style="justify-content:space-between">
      <span class="col" style="gap:3px"><span class="serif" style="font-size:17px">${NC.esc(h.title)}</span><span class="muted" style="font-size:11px">${NC.esc(h.meta)}</span></span>
      <span style="font-size:14px">${NC.money(h.sum)}</span></div>`).join('') || '<span class="muted" style="font-size:13px">Пока пусто</span>'}

    <div class="card col dark" style="gap:10px;background:var(--plum);border:0">
      <span class="serif" style="font-size:18px;color:var(--champagne)">Продлить подписку</span>
      <div class="row" style="gap:8px">${state.d.tariffs.map(t => `
        <button class="chip" data-extend="${t.id}" style="flex:1;flex-direction:column;background:transparent;border-color:rgba(220,192,166,.3);color:var(--champagne);padding:12px 6px">
          <span class="serif" style="font-size:18px">${t.days} дней</span><span style="font-size:10px">${t.perDay} ${NC.cur}/день</span>
        </button>`).join('')}</div>
      <span class="muted" style="font-size:12px;line-height:1.5">Продление тоже проходит через подтверждение — оплата откроется после согласования.</span>
    </div>
  </div>`;
}

/* ---------- вкладка «Профиль» = мои предпочтения ---------- */
function viewProfile() {
  const p = state.draft, o = state.d.options, c = state.d.client;
  return `<div class="col fade" style="gap:14px">
    <div class="col" style="gap:6px">
      <span class="serif" style="font-size:22px">Мои предпочтения</span>
      <span class="q-note">Меняйте что угодно и когда угодно — новый рацион соберём уже с учётом правок.</span>
    </div>

    <div class="card q"><span class="q-title">Тип питания</span>
      ${NC.diets(o.diets, p.diet)}
      <label style="margin-top:4px"><span class="mono">Уточнения</span>
        <textarea data-p="dietNote" placeholder="Если ваш вариант сложнее списка">${NC.esc(p.dietNote || '')}</textarea></label></div>

    <div class="card q"><span class="q-title">Основная цель</span>${NC.chips('goals', o.goals, p.goals)}</div>

    <div class="card q"><span class="q-title">Медицинские особенности</span>
      ${NC.chips('medical', o.medical, p.medical)}
      <textarea data-p="medicalNote" placeholder="Подробнее">${NC.esc(p.medicalNote)}</textarea></div>

    <div class="card q"><span class="q-title">Не ем</span>
      ${NC.chips('dislikes', o.products, p.dislikes)}
      <input data-p="dislikesNote" value="${NC.esc(p.dislikesNote)}" placeholder="Что-то ещё"></div>

    <div class="card q"><span class="q-title">Люблю</span>
      ${NC.chips('likes', o.products, p.likes)}
      <input data-p="likesNote" value="${NC.esc(p.likesNote)}" placeholder="Что-то ещё"></div>

    <div class="card q"><span class="q-title">Никогда не использовать</span>
      <textarea data-p="never" placeholder="Категорические запреты">${NC.esc(p.never)}</textarea></div>

    <div class="card q"><span class="q-title">В какие дни привозить</span>
      ${NC.days(o.weekdays, p.weekdays)}
      <span class="q-note">Пропущенные дни не сгорают — программа продлевается.</span>
      <span class="q-title" style="margin-top:6px">На скольких человек</span>${NC.radios('persons', o.persons, p.persons)}</div>

    <div class="card q"><span class="q-title">Приёмов пищи</span>${NC.radios('meals', o.meals, p.meals)}
      <span class="q-title" style="margin-top:6px">Супы</span>${NC.radios('soups', o.soups, p.soups)}
      <span class="q-title" style="margin-top:6px">Кухня</span>${NC.radios('cuisine', o.cuisines, p.cuisine)}
      <span class="q-title" style="margin-top:6px">Порции</span>${NC.radios('portion', o.portions, p.portion)}
      <label style="margin-top:6px"><span class="mono">Любимые блюда</span>
        <textarea data-p="favDishes">${NC.esc(p.favDishes)}</textarea></label></div>

    <div class="card q"><span class="q-title">КБЖУ</span>
      <div class="chips" data-kbju>
        <button type="button" class="chip ${p.kbju.on ? '' : 'on'}" data-on="0">Не считаю</button>
        <button type="button" class="chip ${p.kbju.on ? 'on' : ''}" data-on="1">Есть цифры</button>
      </div>
      ${p.kbju.on ? `<div class="grid" style="grid-template-columns:repeat(2,1fr);gap:10px">
        <label><span class="mono">Калории</span><input data-k="kcal" value="${NC.esc(p.kbju.kcal)}" inputmode="numeric"></label>
        <label><span class="mono">Белки, г</span><input data-k="p" value="${NC.esc(p.kbju.p)}" inputmode="numeric"></label>
        <label><span class="mono">Жиры, г</span><input data-k="f" value="${NC.esc(p.kbju.f)}" inputmode="numeric"></label>
        <label><span class="mono">Углеводы, г</span><input data-k="c" value="${NC.esc(p.kbju.c)}" inputmode="numeric"></label>
      </div>
      <label><span class="mono">Рекомендации тренера / нутрициолога</span><textarea data-k="note">${NC.esc(p.kbju.note)}</textarea></label>` : ''}</div>

    <div class="card q"><span class="q-title">Что для меня самое важное</span>
      <span class="q-note">До трёх пунктов.</span>
      ${NC.chips('priorities', o.priorities, p.priorities, state.d.priorityLimit || 3)}</div>

    <div class="card q"><span class="q-title">Доставка</span>
      <label><span class="mono">Адрес</span><input data-d="address" value="${NC.esc(p.delivery.address)}"></label>
      <div class="grid g3" style="gap:10px">
        <label><span class="mono">Подъезд</span><input data-d="entrance" value="${NC.esc(p.delivery.entrance)}"></label>
        <label><span class="mono">Этаж</span><input data-d="floor" value="${NC.esc(p.delivery.floor)}"></label>
        <label><span class="mono">Домофон</span><input data-d="intercom" value="${NC.esc(p.delivery.intercom)}"></label>
      </div>
      <label><span class="mono">Комментарий курьеру</span><input data-d="note" value="${NC.esc(p.delivery.note)}"></label>
      <span class="mono" style="margin-top:4px">Окно доставки</span>
      <div class="chips" data-slot>${state.d.slots.map(s =>
        `<button type="button" class="chip ${p.delivery.slot === s.id ? 'on' : ''}" data-val="${s.id}" style="font-family:var(--mono);font-size:11px">${s.label}</button>`).join('')}</div></div>

    <div class="card q"><span class="q-title">Что-то ещё</span>
      <textarea data-p="extra" placeholder="Любые пожелания">${NC.esc(p.extra)}</textarea>
      <label><span class="mono">Вес, кг</span><input data-p="weight" value="${NC.esc(p.weight)}" inputmode="decimal"></label></div>

    <button class="btn wide" id="save-profile">Сохранить предпочтения</button>
    <button class="btn ghost wide" id="pause">${c.paused ? 'Возобновить рацион' : 'Поставить рацион на паузу'}</button>
  </div>`;
}

/* ---------- обработчики ---------- */
function wire() {
  const id = state.d.client.id;

  if (state.tab === 'profile') {
    const p = state.draft;
    NC.bindPickers($('body'), p, () => { state.dirty = true; });
    document.querySelectorAll('[data-p]').forEach(el => el.oninput = () => { p[el.dataset.p] = el.value; state.dirty = true; });
    document.querySelectorAll('[data-d]').forEach(el => el.oninput = () => { p.delivery[el.dataset.d] = el.value; state.dirty = true; });
    document.querySelectorAll('[data-k]').forEach(el => el.oninput = () => { p.kbju[el.dataset.k] = el.value; state.dirty = true; });
    const dt = document.querySelector('[data-diet]');
    if (dt) dt.querySelectorAll('.diet').forEach(b => b.onclick = () => {
      dt.querySelectorAll('.diet').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); p.diet = b.dataset.val; state.dirty = true;
    });
    const dw = document.querySelector('[data-days]');
    if (dw) dw.querySelectorAll('button').forEach(b => b.onclick = () => {
      const n = +b.dataset.n, i = p.weekdays.indexOf(n);
      if (i >= 0) { if (p.weekdays.length === 1) return NC.toast('Оставьте хотя бы один день'); p.weekdays.splice(i, 1); }
      else p.weekdays.push(n);
      b.classList.toggle('on'); state.dirty = true;
    });
    const kb = document.querySelector('[data-kbju]');
    if (kb) kb.querySelectorAll('.chip').forEach(b => b.onclick = () => { p.kbju.on = b.dataset.on === '1'; state.dirty = true; render(); });
    const sl = document.querySelector('[data-slot]');
    if (sl) sl.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      sl.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); p.delivery.slot = b.dataset.val; state.dirty = true;
    });
    const save = $('save-profile');
    if (save) save.onclick = async () => {
      try {
        await NC.api('/api/client/' + id + '/profile', { method: 'PUT', body: p });
        state.dirty = false; NC.toast('Предпочтения сохранены'); await reload();
      } catch (e) { NC.toast(e.message); }
    };
  }

  const pause = $('pause');
  if (pause) pause.onclick = async () => {
    try { await NC.api('/api/client/' + id + '/pause', { method: 'POST', body: {} }); NC.toast('Запрос отправлен'); await reload(); }
    catch (e) { NC.toast(e.message); }
  };

  document.querySelectorAll('[data-tab-jump]').forEach(b => b.onclick = () => { state.tab = b.dataset.tabJump; render(); });

  document.querySelectorAll('[data-swap]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    state.swap = { cat: b.dataset.swap, date: b.dataset.date };
    render();
  });
  const cancel = $('swap-cancel');
  if (cancel) cancel.onclick = () => { state.swap = null; render(); };
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    try {
      await NC.api('/api/client/' + id + '/swap', { method: 'POST', body: { cat: state.swap.cat, date: state.swap.date, dishId: b.dataset.pick } });
      state.swap = null; NC.toast('Запрос замены отправлен'); await reload();
    } catch (e) { NC.toast(e.message); }
  });

  document.querySelectorAll('[data-extend]').forEach(b => b.onclick = async () => {
    try {
      const r = await NC.api('/api/client/' + id + '/extend', { method: 'POST', body: { tariffId: b.dataset.extend } });
      location.href = '/order.html?order=' + r.order.id;
    } catch (e) { NC.toast(e.message); }
  });

  /* оценки */
  document.querySelectorAll('[data-stars]').forEach(box => {
    box.querySelectorAll('button').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      await rate({ dishId: box.dataset.stars, date: box.dataset.date, stars: +b.dataset.n });
    });
  });
  document.querySelectorAll('[data-mark]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    await rate({ dishId: b.dataset.dishId, date: b.dataset.date, mark: b.dataset.mark });
  });
  document.querySelectorAll('[data-save-review]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const ta = document.querySelector(`[data-review="${b.dataset.saveReview}"][data-date="${b.dataset.date}"]`);
    await rate({ dishId: b.dataset.saveReview, date: b.dataset.date, text: ta ? ta.value : '' }, 'Спасибо за отзыв');
  });
}

async function rate(body, msg) {
  try {
    await NC.api('/api/client/' + state.d.client.id + '/rate', { method: 'POST', body: body });
    NC.toast(msg || 'Оценка сохранена');
    await reload();
  } catch (e) { NC.toast(e.message); }
}

load();
</script>
</body>
</html>
