<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NC meals — оформление рациона</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nc.css">
</head>
<body>
<div class="phone">
  <header>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost sm" id="back" style="width:38px;height:38px;padding:0;border-radius:50%">‹</button>
      <span class="mono" id="counter"></span>
      <span style="width:38px"></span>
    </div>
    <h1 class="serif" id="step-title" style="font-size:27px"></h1>
    <span id="step-note" style="font-size:12.5px;line-height:1.5;color:var(--muted)"></span>
    <div class="dots" id="dots"></div>
  </header>

  <main id="body"></main>

  <div class="sticky">
    <div class="col" style="gap:2px">
      <span class="mono" id="total-label">Стоимость</span>
      <span class="serif" id="total" style="font-size:24px;line-height:1"></span>
    </div>
    <button class="btn" id="cta" style="flex:1"></button>
  </div>
</div>

<script src="/js/nc.js"></script>
<script>
const QSTEPS = 7;                          // разделов анкеты
const state = {
  step: 1, welcome: false, data: null, opts: null, orderId: null, order: null,
  form: {
    tariffId: 't14', name: '', phone: '', flat: '', promo: '', promoOk: 0, pay: 'card', clientId: null, known: '', terms: false,
    profile: {
      diet: 'omnivore', dietNote: '',
      goals: [], medical: [], medicalNote: '', dislikes: [], dislikesNote: '',
      likes: [], likesNote: '', never: '', meals: 4, soups: 'Иногда', cuisine: 'Смешанная',
      favDishes: '', kbju: { on: false, kcal: '', p: '', f: '', c: '', note: '' },
      priorities: [], delivery: { address: '', entrance: '', floor: '', intercom: '', note: '', slot: 's1' },
      extra: '', weight: '', portion: 'обычная',
      persons: 1, weekdays: [1, 2, 3, 4, 5, 6, 7], slotNote: ''
    }
  }
};

const TITLES = ['Выберите рацион', 'Основная цель', 'Медицинские особенности', 'Тип питания', 'Вкусы и предпочтения',
  'КБЖУ и приоритеты', 'Доставка и контакты', 'Заявка отправлена', 'Оплата рациона', 'Готово'];
const NOTES = ['Чем длиннее рацион, тем ниже цена дня.',
  'Расскажите, какой результат вы хотите получить. Можно выбрать несколько вариантов.',
  'Очень важный раздел — от него зависит, что попадёт к вам в контейнер.',
  'Выберите вариант, который ближе всего. Детали уточним на следующем шаге.',
  'Чем подробнее ответите, тем меньше придётся править потом.',
  'Считать ничего не нужно — заполняйте, только если у вас есть конкретные цифры.',
  'Это анкета, оплата не потребуется. Мы свяжемся и подтвердим рацион.',
  '', '', ''];
const CTA = ['Далее', 'Далее', 'Далее', 'Далее', 'Далее', 'Далее', 'Отправить заявку',
  'Проверить статус', 'Оплатить рацион', 'В личный кабинет'];

const $ = (id) => document.getElementById(id);
const P = () => state.form.profile;
const tariff = () => state.data.tariffs.find(t => t.id === state.form.tariffId) || state.data.tariffs[0];
const discount = () => state.order ? (state.order.promoDiscount || 0) : (state.form.promoOk || 0);
const slotOf = (id) => state.data.slots.find(s => s.id === id) || state.data.slots[0];
const slotExtra = () => +(slotOf(P().delivery.slot).extra || 0);
const sum = () => {
  if (state.order) return state.order.sum;
  const base = tariff().perDay * tariff().days + slotExtra();
  return discount() ? Math.round(base * (1 - discount() / 100)) : base;
};

async function boot() {
  state.data = await NC.api('/api/public');
  state.opts = state.data.options;
  NC.cur = state.data.content.currency || '₾';
  P().delivery.slot = state.data.slots[0].id;

  // норма, рассчитанная калькулятором на главной
  try {
    const saved = localStorage.getItem('nc_kbju');
    if (saved) {
      const k = JSON.parse(saved);
      if (k && k.kcal) {
        P().kbju = Object.assign(P().kbju, k, { mode: 'manual', on: true });
        NC.toast('Норма из калькулятора подставлена');
      }
      localStorage.removeItem('nc_kbju');
    }
  } catch (e) { /* повреждённые данные просто игнорируем */ }

  const q = new URLSearchParams(location.search);
  if (q.get('tariff')) state.form.tariffId = q.get('tariff');
  if (q.get('order')) { state.orderId = q.get('order'); await refresh(); state.step = 8; render(); return; }

  // повторный заказ: если человек уже заходил в кабинет — подтягиваем профиль
  const id = NC.clientId();
  if (id && NC.token()) {
    try {
      const d = await NC.api('/api/client/' + id);
      applyKnown(d.client, d.profile);
      state.welcome = true;
    } catch (e) { /* токен протух — покажем обычную анкету */ }
  }
  render();
}

function applyKnown(client, profile) {
  const f = state.form;
  f.clientId = client.id;
  f.name = client.name;
  f.phone = client.phone;
  f.known = client.kitchen || '';
  const p = P();
  Object.assign(p, profile);
  p.kbju = Object.assign({ on: false, mode: 'off', kcal: '', p: '', f: '', c: '', note: '', calc: {} }, profile.kbju || {});
  p.delivery = Object.assign({ address: '', entrance: '', floor: '', intercom: '', note: '', slot: 's1' }, profile.delivery || {});
}

async function refresh() {
  if (!state.orderId) return;
  const r = await NC.api('/api/orders/' + state.orderId);
  state.order = r.order;
  if (state.order.status === 'approved' && state.step === 8) state.step = 9;
  if (state.order.status === 'paid') state.step = 10;
}

function render() {
  if (state.welcome) return renderWelcome();
  $('counter').textContent = state.step > QSTEPS ? 'заявка' : 'шаг ' + state.step + ' из ' + QSTEPS;
  $('step-title').textContent = TITLES[state.step - 1];
  $('step-note').textContent = NOTES[state.step - 1] || '';
  $('dots').innerHTML = Array.from({ length: QSTEPS }, (_, i) =>
    '<i class="' + (i + 1 <= state.step ? 'on' : '') + '"></i>').join('');
  $('total-label').textContent = state.step === 9 ? 'К оплате' : 'Стоимость';
  $('total').textContent = NC.money(sum());
  $('cta').textContent = CTA[state.step - 1];
  $('back').style.visibility = (state.step === 1 || state.step > QSTEPS) ? 'hidden' : 'visible';
  $('body').innerHTML = [step1, step2, step3, step4, step5, step6, step7, step8, step9, step10][state.step - 1]();
  wire();
}

/* ---------- экран повторного клиента ---------- */
function renderWelcome() {
  const p = P();
  $('counter').textContent = 'с возвращением';
  $('step-title').textContent = state.form.known || 'Мы помним ваши предпочтения';
  $('step-note').textContent = 'Хотите что-нибудь изменить?';
  $('dots').innerHTML = '';
  $('total-label').textContent = 'Стоимость';
  $('total').textContent = NC.money(sum());
  $('cta').textContent = 'Всё верно, к тарифу';
  $('back').style.visibility = 'hidden';
  const rows = [
    ['Тип питания', dietName(p.diet)],
    ['Цель', p.goals.join(', ')],
    ['Медицинские особенности', p.medical.join(', ')],
    ['Не едите', p.dislikes.join(', ')],
    ['Любите', p.likes.join(', ')],
    ['Никогда не использовать', p.never],
    ['Приёмов пищи', p.meals],
    ['Кухня', p.cuisine],
    ['Адрес', p.delivery.address]
  ].filter(r => r[1]);
  $('body').innerHTML = '<div class="col fade" style="gap:16px">' +
    '<div class="card col" style="gap:12px"><span class="mono">Ваш профиль</span>' +
    '<div class="kv">' + rows.map(([k, v]) =>
      '<div><span class="muted">' + k + '</span><b>' + NC.esc(String(v)) + '</b></div>').join('') + '</div></div>' +
    '<button class="btn ghost wide" id="edit-profile">Редактировать профиль</button>' +
    '<span class="muted" style="font-size:12.5px;line-height:1.55">Если ничего не изменилось — просто выберите рацион, анкету заново заполнять не нужно.</span>' +
    '</div>';
  $('edit-profile').onclick = () => { state.welcome = false; state.step = 2; render(); };
}

/* ---------- 1. рацион ---------- */
function step1() {
  const f = state.form, o = state.opts;
  return `<div class="col fade" style="gap:14px">
    ${state.data.tariffs.map(t => `
      <div class="card row ${t.id === f.tariffId ? 'sel' : ''}" data-tariff="${t.id}" style="cursor:pointer;gap:14px">
        <span style="width:20px;height:20px;border-radius:50%;border:1px solid ${t.id === f.tariffId ? 'var(--gold-solid)' : 'rgba(74,36,61,.3)'};background:${t.id === f.tariffId ? 'var(--gold-solid)' : 'transparent'}"></span>
        <span class="col" style="flex:1;gap:3px"><span class="serif" style="font-size:20px">${NC.esc(t.name)}</span><span class="muted" style="font-size:12px">${t.days} дней · ${t.perDay} ${NC.cur}/день</span></span>
        <span class="serif" style="font-size:22px;white-space:nowrap">${NC.money(t.perDay * t.days)}</span>
      </div>`).join('')}
    <div class="card q">
      <span class="q-title">Сколько приёмов пищи хотите получать?</span>
      ${NC.radios('meals', o.meals, P().meals)}
      <span class="q-note">${P().meals === 3 ? 'Завтрак, обед, ужин' : P().meals === 4 ? 'Завтрак, обед, ужин и перекус' : 'Полный день с двумя перекусами'}</span>
      <span class="q-title" style="margin-top:8px">На скольких человек?</span>
      ${NC.radios('persons', o.persons, P().persons)}
      <span class="q-note">Для пар готовим двойные порции каждого блюда.</span>
    </div>
    <div class="card q">
      <span class="q-title">В какие дни привозить?</span>
      <span class="q-note">Можно получать рацион не каждый день — программа продлится на пропущенные дни.</span>
      ${NC.days(o.weekdays, P().weekdays)}
    </div>
    <button class="btn ghost sm" id="known" style="align-self:flex-start">Я уже заказывал(а) — подставить профиль</button>
  </div>`;
}

/* ---------- 2. цель ---------- */
function step2() {
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Какой результат вы хотите получить?</span>
      ${NC.chips('goals', state.opts.goals, P().goals)}
    </div>
    <div class="card q">
      <span class="q-title">Вес, кг</span>
      <span class="q-note">Необязательно. Помогает точнее рассчитать порции.</span>
      <input data-p="weight" value="${NC.esc(P().weight)}" placeholder="58" inputmode="decimal">
    </div>
    <div class="card q">
      <span class="q-title">Размер порций</span>
      ${NC.radios('portion', state.opts.portions, P().portion)}
    </div>
  </div>`;
}

/* ---------- 3. здоровье ---------- */
function step3() {
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Есть ли у вас:</span>
      ${NC.chips('medical', state.opts.medical, P().medical)}
      <label><span class="mono">Расскажите подробнее</span>
        <textarea data-p="medicalNote" placeholder="Например: аллергия на цитрусовые">${NC.esc(P().medicalNote)}</textarea></label>
    </div>
    <div class="card q">
      <span class="q-title">Продукты, которые категорически нельзя использовать</span>
      <span class="q-note">Это правило без исключений — такие продукты не попадут в рацион ни при каких заменах.</span>
      <textarea data-p="never" placeholder="Например: свинина в любом виде">${NC.esc(P().never)}</textarea>
    </div>
  </div>`;
}

/* ---------- 4. тип питания ---------- */
function step4() {
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Какой тип питания вам ближе?</span>
      ${NC.diets(state.opts.diets, P().diet)}
    </div>
    <div class="card q">
      <span class="q-title">Уточнения</span>
      <span class="q-note">Если ваш вариант сложнее списка — опишите словами.</span>
      <textarea data-p="dietNote" placeholder="Например: пескетарианец, но по выходным ем курицу">${NC.esc(P().dietNote)}</textarea>
    </div>
  </div>`;
}

/* ---------- 5. вкусы ---------- */
function step5() {
  const o = state.opts;
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Какие продукты вы НЕ едите?</span>
      ${NC.chips('dislikes', o.products, P().dislikes)}
      <input data-p="dislikesNote" value="${NC.esc(P().dislikesNote)}" placeholder="Что-то ещё, чего нет в списке">
    </div>
    <div class="card q">
      <span class="q-title">Что вы очень любите?</span>
      ${NC.chips('likes', o.products, P().likes)}
      <input data-p="likesNote" value="${NC.esc(P().likesNote)}" placeholder="Что-то ещё, чего нет в списке">
    </div>
    <div class="card q">
      <span class="q-title">Любите ли супы?</span>
      ${NC.radios('soups', o.soups, P().soups)}
    </div>
    <div class="card q">
      <span class="q-title">Предпочитаете кухню</span>
      ${NC.radios('cuisine', o.cuisines, P().cuisine)}
    </div>
    <div class="card q">
      <span class="q-title">Есть ли любимые блюда?</span>
      <textarea data-p="favDishes" placeholder="Например: лосось на гриле, овощные боулы">${NC.esc(P().favDishes)}</textarea>
    </div>
  </div>`;
}

/* ---------- 6. КБЖУ и приоритеты ---------- */
function step6() {
  const k = P().kbju;
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Хотите придерживаться конкретного КБЖУ?</span>
      <span class="q-note">Считать ничего не нужно. Если цифр нет — выберите «Нет», мы подберём норму сами.</span>
      <div class="chips" data-kbju>
        <button type="button" class="chip ${k.mode === 'calc' || k.on ? '' : 'on'}" data-mode="off">Нет, подберите сами</button>
        <button type="button" class="chip ${k.mode === 'calc' ? 'on' : ''}" data-mode="calc">Рассчитать</button>
        <button type="button" class="chip ${k.on && k.mode !== 'calc' ? 'on' : ''}" data-mode="manual">У меня есть цифры</button>
      </div>
      ${k.mode === 'calc' ? NC.kbjuForm(k) : ''}
      ${k.on && k.mode !== 'calc' ? `
        <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:10px">
          <label><span class="mono">Калории</span><input data-k="kcal" value="${NC.esc(k.kcal)}" inputmode="numeric" placeholder="1900"></label>
          <label><span class="mono">Белки, г</span><input data-k="p" value="${NC.esc(k.p)}" inputmode="numeric" placeholder="130"></label>
          <label><span class="mono">Жиры, г</span><input data-k="f" value="${NC.esc(k.f)}" inputmode="numeric" placeholder="70"></label>
          <label><span class="mono">Углеводы, г</span><input data-k="c" value="${NC.esc(k.c)}" inputmode="numeric" placeholder="210"></label>
        </div>
        <label><span class="mono">Или рекомендации тренера / нутрициолога</span>
          <textarea data-k="note" placeholder="Вставьте текст рекомендаций">${NC.esc(k.note)}</textarea></label>` : ''}
    </div>
    <div class="card q">
      <span class="q-title">Что для вас самое важное?</span>
      <span class="q-note">Выберите до трёх пунктов.</span>
      ${NC.chips('priorities', state.opts.priorities, P().priorities, state.data.priorityLimit || 3)}
    </div>
  </div>`;
}

/* ---------- 7. доставка и контакты ---------- */
function step7() {
  const f = state.form, d = P().delivery;
  return `<div class="col fade" style="gap:14px">
    <div class="card q">
      <span class="q-title">Контакты</span>
      <label><span class="mono">Имя и фамилия</span><input data-f="name" value="${NC.esc(f.name)}" placeholder="Нино Церетели"></label>
      <label><span class="mono">Телефон</span><input data-f="phone" value="${NC.esc(f.phone)}" placeholder="+995 555 12 34 56" inputmode="tel"></label>
    </div>
    <div class="card q">
      <span class="q-title">Доставка</span>
      <label><span class="mono">Адрес</span><input data-d="address" value="${NC.esc(d.address)}" placeholder="Ваке, ул. Абашидзе 24"></label>
      <div class="grid g3" style="gap:10px">
        <label><span class="mono">Подъезд</span><input data-d="entrance" value="${NC.esc(d.entrance)}" placeholder="2"></label>
        <label><span class="mono">Этаж</span><input data-d="floor" value="${NC.esc(d.floor)}" placeholder="5"></label>
        <label><span class="mono">Домофон</span><input data-d="intercom" value="${NC.esc(d.intercom)}" placeholder="12К"></label>
      </div>
      <label><span class="mono">Комментарий курьеру</span><input data-d="note" value="${NC.esc(d.note)}" placeholder="Оставить у двери…"></label>
      <span class="mono" style="margin-top:4px">Время доставки</span>
      <div class="chips" data-slot>${state.data.slots.map(s =>
        `<button type="button" class="chip ${d.slot === s.id ? 'on' : ''}" data-val="${s.id}">${NC.esc(s.label)}${s.extra ? ` <b style="font-weight:400">+${s.extra} ${NC.cur}</b>` : ''}</button>`).join('')}</div>
      ${slotOf(d.slot).custom ? `<label style="margin-top:6px"><span class="mono">Желаемое время</span>
        <input data-p="slotNote" value="${NC.esc(P().slotNote)}" placeholder="Например: строго к 08:30"></label>
        <span class="q-note">Согласуем индивидуально. Надбавка ${slotExtra()} ${NC.cur} уже в стоимости.</span>` : ''}
    </div>
    <div class="card q">
      <span class="q-title">Что-то ещё?</span>
      <span class="q-note">Есть ли что-то, что поможет приготовить для вас идеальный рацион?</span>
      <textarea data-p="extra" placeholder="Любые пожелания">${NC.esc(P().extra)}</textarea>
    </div>
    <div class="card q">
      <span class="q-title">Промокод</span>
      <span class="q-note">Если у вас есть код на скидку — введите его здесь.</span>
      <div class="row" style="gap:8px">
        <input data-f="promo" value="${NC.esc(f.promo)}" placeholder="NCSTART" style="text-transform:uppercase;font-family:var(--mono);font-size:13px">
        <button class="btn ghost" id="promo-btn" style="white-space:nowrap">Применить</button>
      </div>
      ${f.promoOk ? `<div class="promo-ok"><b>−${f.promoOk}%</b><span>Код ${NC.esc(f.promo)} применён. Итого ${NC.money(sum())} вместо ${NC.money(tariff().perDay * tariff().days + slotExtra())}.</span></div>` : ''}
    </div>

    <div class="card q">
      <label class="agree"><input type="checkbox" id="terms" ${state.form.terms ? 'checked' : ''}>
        <span>Я ознакомился(-ась) и принимаю <a href="/terms.html" target="_blank">Условия сервиса</a></span></label>
    </div>
    <span class="muted" style="font-size:12.5px;line-height:1.6">Оплата сейчас не потребуется. Мы свяжемся, подтвердим рацион и зону доставки, и только после этого откроем оплату.</span>
  </div>`;
}

/* ---------- 8. заявка на согласовании ---------- */
function step8() {
  const o = state.order || {};
  const st = { pending: 'на согласовании', approved: 'подтверждена', rejected: 'отклонена', paid: 'оплачена' }[o.status] || '—';
  return `<div class="col fade" style="gap:16px">
    <div class="card col" style="gap:14px">
      <div class="row" style="gap:12px">
        <span style="width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center">◷</span>
        <span class="serif" style="font-size:21px">Заявка ${st}</span>
      </div>
      <span class="muted" style="font-size:13.5px;line-height:1.6">Проверим состав рациона, зону и окно доставки и подтвердим заявку в течение дня. Оплата — только после подтверждения.</span>
      <div class="hr"></div>
      ${summary(o)}
    </div>
    <span class="muted" style="font-size:12.5px">Номер заявки ${NC.esc(o.id || '')}. Ссылку можно сохранить: <a href="/order.html?order=${NC.esc(o.id || '')}">статус заявки</a></span>
  </div>`;
}

/* ---------- 9. оплата ---------- */
function step9() {
  const f = state.form, o = state.order || {};
  return `<div class="col fade" style="gap:14px">
    <div class="card col" style="gap:12px">${summary(o)}</div>
    <div class="card col" style="gap:8px">
      <span class="mono">Способ оплаты</span>
      ${[['card', 'Карта онлайн'], ['apple', 'Apple Pay'], ['cash', 'Наличные курьеру']].map(([id, label]) => `
        <div class="row" data-pay="${id}" style="gap:12px;padding:13px 16px;border-radius:12px;cursor:pointer;border:1px solid ${f.pay === id ? 'var(--plum)' : 'var(--line)'}">
          <span style="width:18px;height:18px;border-radius:50%;border:1px solid ${f.pay === id ? 'var(--plum)' : 'rgba(74,36,61,.3)'};background:${f.pay === id ? 'var(--plum)' : 'transparent'}"></span>
          <span style="font-size:14px">${label}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- 10. готово ---------- */
function step10() {
  const o = state.order || {};
  return `<div class="col fade" style="gap:18px;align-items:center;text-align:center;padding:30px 0">
    <div style="width:96px;height:96px;border-radius:50%;background:var(--silk);display:grid;place-items:center;font-size:34px">✓</div>
    <span class="serif" style="font-size:28px">Рацион подтверждён и оплачен</span>
    <span class="muted" style="font-size:14px;line-height:1.6;max-width:26em">Первая доставка — завтра в вашем окне. Меню, КБЖУ и остаток дней уже в личном кабинете.</span>
    <div class="card col" style="gap:10px;width:100%;text-align:left">${summary(o)}</div>
  </div>`;
}

function dietName(id) {
  const d = (state.opts.diets || []).find(x => x.id === id);
  return d ? d.icon + ' ' + d.name : '';
}

function summary(o) {
  const f = state.form, p = o.profile || P();
  const t = state.data.tariffs.find(x => x.id === (o.tariffId || f.tariffId)) || tariff();
  const d = p.delivery || {};
  const slot = (state.data.slots.find(s => s.id === (o.slot || d.slot)) || {}).label || '';
  const rows = [
    ['Рацион', t.name + ' · ' + (o.planDays || t.days) + ' дней'],
    ['Приёмов в день', String(o.meals || p.meals)],
    ['Тип питания', dietName(p.diet)],
    ['Цель', (p.goals || []).join(', ')],
    ['Медицинское', (p.medical || []).join(', ')],
    ['Не едите', (p.dislikes || []).join(', ')],
    ['Никогда', p.never],
    ['Имя', o.name || f.name],
    ['Телефон', o.phone || f.phone],
    ['Адрес', [d.address, d.entrance && 'подъезд ' + d.entrance, d.floor && 'этаж ' + d.floor].filter(Boolean).join(', ')],
    ['Окно доставки', slot + (o.slotNote || p.slotNote ? ' · ' + (o.slotNote || p.slotNote) : '')],
    ['Дней доставки в неделю', (p.weekdays || []).length < 7 ? (p.weekdays || []).length + ' из 7' : ''],
    ['Персон', (o.profile || p).persons > 1 ? (o.profile || p).persons : ''],
    ['Индивидуальное время', (o.slotExtra || slotExtra()) ? '+' + (o.slotExtra || slotExtra()) + ' ' + NC.cur : ''],
    ['Промокод', (o.promo || f.promo) ? (o.promo || f.promo) + ((o.promoDiscount || f.promoOk) ? ' · −' + (o.promoDiscount || f.promoOk) + '%' : ' · не сработал') : ''],
    ['Итого', NC.money(o.sum || sum())]
  ].filter(r => r[1]);
  return rows.map(([k, v]) =>
    `<div class="row" style="justify-content:space-between;gap:14px;font-size:13px"><span class="muted">${k}</span><span style="text-align:right">${NC.esc(v)}</span></div>`).join('');
}

function wire() {
  const f = state.form, p = P();
  NC.bindPickers($('body'), p, () => { if (state.step === 1) render(); });

  document.querySelectorAll('[data-tariff]').forEach(el => el.onclick = () => { f.tariffId = el.dataset.tariff; render(); });
  document.querySelectorAll('[data-pay]').forEach(el => el.onclick = () => { f.pay = el.dataset.pay; render(); });
  document.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { f[el.dataset.f] = el.value; });
  document.querySelectorAll('[data-p]').forEach(el => el.oninput = () => { p[el.dataset.p] = el.value; });
  document.querySelectorAll('[data-d]').forEach(el => el.oninput = () => { p.delivery[el.dataset.d] = el.value; });
  document.querySelectorAll('[data-k]').forEach(el => el.oninput = () => { p.kbju[el.dataset.k] = el.value; });

  const dt = document.querySelector('[data-diet]');
  if (dt) dt.querySelectorAll('.diet').forEach(b => b.onclick = () => {
    dt.querySelectorAll('.diet').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); p.diet = b.dataset.val;
  });

  const kb = document.querySelector('[data-kbju]');
  if (kb) kb.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const m = b.dataset.mode;
    p.kbju.mode = m;
    p.kbju.on = m === 'manual' ? true : m === 'off' ? false : p.kbju.on;
    render();
  });
  const cf = document.querySelector('.calc');
  if (cf) NC.bindCalc(cf, p.kbju, () => render());   // перерисовка только после «использовать»

  const sl = document.querySelector('[data-slot]');
  if (sl) sl.querySelectorAll('.chip').forEach(b => b.onclick = () => { p.delivery.slot = b.dataset.val; render(); });

  const dw = document.querySelector('[data-days]');
  if (dw) dw.querySelectorAll('button').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, i = p.weekdays.indexOf(n);
    if (i >= 0) { if (p.weekdays.length === 1) return NC.toast('Оставьте хотя бы один день'); p.weekdays.splice(i, 1); }
    else p.weekdays.push(n);
    b.classList.toggle('on');
  });

  const tc = $('terms');
  if (tc) tc.onchange = () => { state.form.terms = tc.checked; };

  const known = $('known');
  if (known) known.onclick = async () => {
    const phone = prompt('Телефон, на который оформляли рацион:');
    if (!phone) return;
    try {
      const r = await NC.api('/api/client/lookup', { method: 'POST', body: { phone } });
      if (!r.found) return NC.toast('Не нашли такой телефон — заполните анкету');
      applyKnown({ id: r.clientId, name: r.name, phone: phone, kitchen: r.kitchen }, r.profile);
      state.welcome = true; render();
    } catch (e) { NC.toast(e.message); }
  };

  const pb = $('promo-btn');
  if (pb) pb.onclick = async () => {
    if (!f.promo.trim()) return NC.toast('Введите промокод');
    try {
      const r = await NC.api('/api/promo/check', { method: 'POST', body: { promo: f.promo } });
      f.promo = r.promo; f.promoOk = r.discount;
      NC.toast('Промокод применён: −' + r.discount + '%');
    } catch (e) { f.promoOk = 0; NC.toast(e.message); }
    render();
  };
}

$('back').onclick = () => { if (state.step > 1) { state.step--; render(); } };

$('cta').onclick = async () => {
  const f = state.form, p = P();
  try {
    if (state.welcome) { state.welcome = false; state.step = 1; return render(); }
    if (state.step < QSTEPS) { state.step++; return render(); }
    if (state.step === QSTEPS) {
      if (!f.name || !f.phone || !p.delivery.address) return NC.toast('Заполните имя, телефон и адрес');
      if (!f.terms) return NC.toast('Примите Условия сервиса');
      const body = {
        name: f.name, phone: f.phone, flat: p.delivery.intercom, promo: f.promo,
        tariffId: f.tariffId, clientId: f.clientId, profile: p, terms: f.terms, slot: p.delivery.slot
      };
      const r = await NC.api('/api/orders', { method: 'POST', body: body });
      state.order = r.order; state.orderId = r.order.id;
      history.replaceState(null, '', '/order.html?order=' + r.order.id);
      state.step = 8; return render();
    }
    if (state.step === 8) {
      await refresh();
      if (state.order.status === 'pending') NC.toast('Заявка ещё на согласовании');
      if (state.order.status === 'rejected') NC.toast('Заявка отклонена — свяжитесь с нами');
      return render();
    }
    if (state.step === 9) {
      const r = await NC.api('/api/orders/' + state.orderId + '/pay', { method: 'POST', body: { pay: f.pay } });
      state.order = r.order;
      NC.setClient(r.clientId);
      state.step = 10; return render();
    }
    location.href = '/cabinet.html';
  } catch (e) { NC.toast(e.message); }
};

boot();
setInterval(() => { if (state.step === 8) refresh().then(render).catch(() => {}); }, 8000);
</script>
</body>
</html>
